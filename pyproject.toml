[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-chatbot"
version = "0.1.0"
description = "Retrieval-Augmented Generation chatbot over an internal document corpus"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "psycopg[binary,pool]>=3.2",
    "pyjwt>=2.9",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "transformers>=4.30",
    "torch>=2.0",
    "chromadb>=0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["packages", "apps"]
include = [
    "core*",
    "llm*",
    "storage*",
    "eval*",
    "api*",
    "worker*",
]
namespaces = false

[tool.pytest.ini_options]
minversion = "8.0"
# Keeps `make test` working without an editable install. Package boundaries are
# enforced by tests/test_dependency_rules.py, not by sys.path trickery.
pythonpath = ["packages", "apps"]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "requires_db: test needs a live PostgreSQL instance",
    "requires_network: test needs outbound network access",
]
filterwarnings = ["error::DeprecationWarning:core.*", "error::DeprecationWarning:llm.*", "error::DeprecationWarning:storage.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["packages", "apps", "tests"]
extend-exclude = ["apps/web"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # bugbear
    "BLE", # blind-except
    "A",   # builtin shadowing
    "C4",  # comprehensions
    "T20", # no print in library code
    "SIM", # simplify
    "RUF",
]
ignore = [
    "B008", # FastAPI Depends() in defaults is the framework idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]
"apps/api/routes/**" = ["B008"]
"tools/**" = ["T20"]
# Command-line entry points exist to print. They are the one place in the tree
# where a human reads the output directly.
"packages/eval/cli.py" = ["T20"]
"packages/storage/db/migrate.py" = ["T20"]
# The error taxonomy deliberately uses short domain names (ValidationFailed, NotFound)
# rather than an Error suffix. These are imported by name at every raise site, so the
# suffix would be noise repeated dozens of times.
"packages/core/errors.py" = ["N818"]

[tool.ruff.lint.isort]
known-first-party = ["core", "llm", "storage", "eval", "api", "worker"]

[tool.mypy]
python_version = "3.11"
mypy_path = ["packages", "apps"]
explicit_package_bases = true
namespace_packages = true
strict = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_reexport = false
plugins = []
exclude = ["^apps/web/", "^infra/"]

[[tool.mypy.overrides]]
module = ["jwt.*", "psycopg.*", "uvicorn.*", "tests.*", "tools.*"]
ignore_missing_imports = true